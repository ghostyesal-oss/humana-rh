<!doctype html>
<html lang="fr" class="auth-booting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#022341">
  <meta name="description" content="Humana, votre espace de gestion des ressources humaines.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-elem 'self'; style-src-attr 'none'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://login.microsoftonline.com; object-src 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()">
  <title>Hiérarchie — Humana</title>
  <script src="preboot.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="hierarchy">
  <div id="auth-boot-screen" class="auth-boot-screen" aria-live="polite" aria-busy="true">
    <div class="auth-boot-card">
      <div class="brand brand-large"><span>H</span> Humana</div>
      <span class="loader" aria-hidden="true"></span>
      <p>Chargement...</p>
    </div>
  </div>
  <div id="app" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="humana-client.js"></script>
  <script src="boot.js"></script>
  <script src="app.js" charset="UTF-8"></script>
  <script src="pages/hierarchy.js" charset="UTF-8"></script>
</body>
</html>
