services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: humana
      POSTGRES_USER: humana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humana -d humana"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - humana

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://humana:${POSTGRES_PASSWORD}@postgres:5432/humana
      APP_DATABASE_URL: postgres://humana_app:${POSTGRES_PASSWORD}@postgres:5432/humana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: "3000"
      STORAGE_ROOT: /data/storage
      HUMANA_DOMAIN: ${HUMANA_DOMAIN}
      APP_ORIGIN: ${APP_ORIGIN}
      BOOTSTRAP_CREATOR_EMAILS: ${BOOTSTRAP_CREATOR_EMAILS:-}
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - humana

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HUMANA_DOMAIN: ${HUMANA_DOMAIN}
      CADDY_ADDRESS: ${CADDY_ADDRESS:-${HUMANA_DOMAIN}}
      API_URL: ""
      REDIRECT_URL: ${APP_ORIGIN}
      PAYROLL_EMAILS: ${PAYROLL_EMAILS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    networks:
      - humana

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: humana
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: humana
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
    volumes:
      - pgbackups:/backups
      - ./scripts/backup-postgres.sh:/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh", "--loop"]
    networks:
      - humana

  watchdog:
    build:
      context: .
      dockerfile: deploy/watchdog.Dockerfile
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DISK_WARN_PCT: ${DISK_WARN_PCT:-90}
      CERT_WARN_DAYS: ${CERT_WARN_DAYS:-14}
      CHECK_INTERVAL_SEC: ${WATCHDOG_INTERVAL_SEC:-300}
    volumes:
      - pgbackups:/backups:ro
    depends_on:
      api:
        condition: service_healthy
      caddy:
        condition: service_started
    networks:
      - humana

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
  pgbackups:

networks:
  humana:
